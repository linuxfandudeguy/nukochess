<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nuko Chess Drag & Drop</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #eee;
}

#board {
  width: 480px;
  height: 480px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 4px solid black;
  position: relative;
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.light { background: #f0d9b5; }
.dark  { background: #b58863; }

.piece {
  width: 40px;
  height: auto;
  image-rendering: pixelated;
  cursor: grab;
}

.label {
  position: absolute;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
}

.highlight {
  outline: 3px solid yellow;
}
</style>
</head>
<body>

<h2>Nuko Chess</h2>
<div id="board"></div>

<script>
const boardElement = document.getElementById("board");

let board = [
  ["r","n","b","q","k","b","n","r"],
  ["p","p","p","p","p","p","p","p"],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["P","P","P","P","P","P","P","P"],
  ["R","N","B","Q","K","B","N","R"]
];

let currentPlayer = "white";

function getPieceImage(piece) {
  const images = {
    "r": "assets/nukoChessRookBlack.gif",
    "n": "assets/nukoChessKnightBlack.gif",
    "b": "assets/nukoChessBishopBlack.gif",
    "q": "assets/nukoChessQueenBlack.gif",
    "k": "assets/nukoChessKingBlack.gif",
    "p": "assets/nukoChessPawnBlack.gif",
    "R": "assets/nukoChessRookWhite.gif",
    "N": "assets/nukoChessKnightWhite.gif",
    "B": "assets/nukoChessBishopWhite.gif",
    "Q": "assets/nukoChessQueenWhite.gif",
    "K": "assets/nukoChessKingWhite.gif",
    "P": "assets/nukoChessPawnWhite.gif"
  };
  return images[piece] || null;
}

function renderBoard() {
  boardElement.innerHTML = "";

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const square = document.createElement("div");
      square.classList.add("square");
      square.classList.add((row + col) % 2 === 0 ? "light" : "dark");
      square.dataset.row = row;
      square.dataset.col = col;

      const piece = board[row][col];
      const imgSrc = getPieceImage(piece);
      if (imgSrc) {
        const img = document.createElement("img");
        img.src = imgSrc;
        img.classList.add("piece");
        img.draggable = true;
        img.dataset.row = row;
        img.dataset.col = col;

        img.addEventListener("dragstart", onDragStart);
        img.addEventListener("dragend", onDragEnd);

        square.appendChild(img);
      }

      square.addEventListener("dragover", e => e.preventDefault());
      square.addEventListener("drop", onDrop);

      boardElement.appendChild(square);
    }
  }

  addBoardLabels();
}

function addBoardLabels() {
  const files = ["a","b","c","d","e","f","g","h"];
  for (let i = 0; i < 8; i++) {
    const fileLabel = document.createElement("div");
    fileLabel.className = "label";
    fileLabel.textContent = files[i];
    fileLabel.style.bottom = "2px";
    fileLabel.style.left = (i * 60 + 6) + "px";
    boardElement.appendChild(fileLabel);

    const rankLabel = document.createElement("div");
    rankLabel.className = "label";
    rankLabel.textContent = 8 - i;
    rankLabel.style.top = (i * 60 + 2) + "px";
    rankLabel.style.left = "2px";
    boardElement.appendChild(rankLabel);
  }
}

// Drag & Drop
let draggedPiece = null;

function onDragStart(e) {
  const piece = e.target;
  const row = parseInt(piece.dataset.row);
  const col = parseInt(piece.dataset.col);
  if (!isCurrentPlayersPiece(board[row][col])) { e.preventDefault(); return; }
  draggedPiece = { row, col, piece: board[row][col] };
}

function onDragEnd(e) {
  draggedPiece = null;
}

function onDrop(e) {
  if (!draggedPiece) return;
  const targetRow = parseInt(e.currentTarget.dataset.row);
  const targetCol = parseInt(e.currentTarget.dataset.col);

  if (isValidMove(draggedPiece.row, draggedPiece.col, targetRow, targetCol)) {
    movePiece(draggedPiece.row, draggedPiece.col, targetRow, targetCol);
  }

  draggedPiece = null;
  renderBoard();
}

// Movement & AI
function movePiece(fr, fc, tr, tc) {
  const piece = board[fr][fc];
  board[tr][tc] = piece;
  board[fr][fc] = "";

  // Pawn promotion
  if (piece.toLowerCase() === "p" && (tr === 0 || tr === 7)) {
    board[tr][tc] = piece === piece.toUpperCase() ? "Q" : "q";
  }

  currentPlayer = currentPlayer === "white" ? "black" : "white";
  if (currentPlayer === "black") setTimeout(makeAIMove, 400);
}

// AI Random Move
function makeAIMove() {
  const moves = [];
  for (let fr = 0; fr < 8; fr++) {
    for (let fc = 0; fc < 8; fc++) {
      const piece = board[fr][fc];
      if (!piece || piece !== piece.toLowerCase()) continue;
      for (let tr = 0; tr < 8; tr++)
        for (let tc = 0; tc < 8; tc++)
          if (isValidMove(fr, fc, tr, tc)) moves.push({ fr, fc, tr, tc });
    }
  }
  if (moves.length === 0) return;
  const move = moves[Math.floor(Math.random() * moves.length)];
  movePiece(move.fr, move.fc, move.tr, move.tc);
  renderBoard();
}

// Rules & Validation
function isCurrentPlayersPiece(piece) {
  return currentPlayer === "white" ? piece === piece.toUpperCase() : piece === piece.toLowerCase();
}

function isSameColor(a,b) {
  return (a===a.toUpperCase()) === (b===b.toUpperCase());
}

function isPathClear(fr, fc, tr, tc) {
  const dr = Math.sign(tr-fr);
  const dc = Math.sign(tc-fc);
  let r=fr+dr, c=fc+dc;
  while (r!==tr || c!==tc) { if(board[r][c]!=="") return false; r+=dr;c+=dc; }
  return true;
}

function isValidMove(fr,fc,tr,tc){
  const piece = board[fr][fc];
  if(!piece) return false;
  const target = board[tr][tc];
  if(target && isSameColor(piece,target)) return false;
  const dr=tr-fr, dc=tc-fc, lower=piece.toLowerCase();
  switch(lower){
    case "p": return validatePawn(piece,fr,fc,tr,tc,dr,dc);
    case "r": return (fr===tr||fc===tc)&&isPathClear(fr,fc,tr,tc);
    case "b": return (Math.abs(dr)===Math.abs(dc))&&isPathClear(fr,fc,tr,tc);
    case "q": return (fr===tr||fc===tc||Math.abs(dr)===Math.abs(dc))&&isPathClear(fr,fc,tr,tc);
    case "k": return Math.abs(dr)<=1&&Math.abs(dc)<=1;
    case "n": return (Math.abs(dr)===2&&Math.abs(dc)===1)||(Math.abs(dr)===1&&Math.abs(dc)===2);
  }
  return false;
}

function validatePawn(piece, fr, fc, tr, tc, dr, dc){
  const isWhite = piece===piece.toUpperCase();
  const direction = isWhite?-1:1;
  const startRow = isWhite?6:1;
  if(dc===0 && dr===direction && !board[tr][tc]) return true;
  if(dc===0 && dr===2*direction && fr===startRow && !board[tr][tc] && !board[fr+direction][fc]) return true;
  if(Math.abs(dc)===1 && dr===direction && board[tr][tc]) return true;
  return false;
}

renderBoard();
</script>
</body>
</html>
