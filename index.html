<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nuko Chess</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #eee;
}

#board {
  width: 480px;
  height: 480px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border: 4px solid black;
  position: relative;
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.light { background: #f0d9b5; }
.dark  { background: #b58863; }

.piece {
  width: 40px;
  height: auto;
  image-rendering: pixelated;
  pointer-events: none;
}

.label {
  position: absolute;
  font-size: 12px;
  font-weight: bold;
  pointer-events: none;
}
</style>
</head>

<body>

<h2>Nuko Chess</h2>
<div id="board"></div>

<script>
const boardElement = document.getElementById("board");

let board = [
  ["r","n","b","q","k","b","n","r"],
  ["p","p","p","p","p","p","p","p"],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["P","P","P","P","P","P","P","P"],
  ["R","N","B","Q","K","B","N","R"]
];

let currentPlayer = "white";
let selected = null;

function getPieceImage(piece) {
  const images = {
    "r": "assets/nukoChessRookBlack.gif",
    "n": "assets/nukoChessKnightBlack.gif",
    "b": "assets/nukoChessBishopBlack.gif",
    "q": "assets/nukoChessQueenBlack.gif",
    "k": "assets/nukoChessKingBlack.gif",
    "p": "assets/nukoChessPawnBlack.gif",
    "R": "assets/nukoChessRookWhite.gif",
    "N": "assets/nukoChessKnightWhite.gif",
    "B": "assets/nukoChessBishopWhite.gif",
    "Q": "assets/nukoChessQueenWhite.gif",
    "K": "assets/nukoChessKingWhite.gif",
    "P": "assets/nukoChessPawnWhite.gif"
  };
  return images[piece] || null;
}

function renderBoard() {
  boardElement.innerHTML = "";

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const square = document.createElement("div");
      square.classList.add("square");
      square.classList.add((row + col) % 2 === 0 ? "light" : "dark");
      square.dataset.row = row;
      square.dataset.col = col;

      const piece = board[row][col];
      const imgSrc = getPieceImage(piece);

      if (imgSrc) {
        const img = document.createElement("img");
        img.src = imgSrc;
        img.classList.add("piece");
        square.appendChild(img);
      }

      square.addEventListener("click", handleClick);
      boardElement.appendChild(square);
    }
  }

  addBoardLabels();
}

function addBoardLabels() {
  const files = ["a","b","c","d","e","f","g","h"];

  for (let i = 0; i < 8; i++) {
    const fileLabel = document.createElement("div");
    fileLabel.className = "label";
    fileLabel.textContent = files[i];
    fileLabel.style.bottom = "2px";
    fileLabel.style.left = (i * 60 + 6) + "px";
    boardElement.appendChild(fileLabel);

    const rankLabel = document.createElement("div");
    rankLabel.className = "label";
    rankLabel.textContent = 8 - i;
    rankLabel.style.top = (i * 60 + 2) + "px";
    rankLabel.style.left = "2px";
    boardElement.appendChild(rankLabel);
  }
}

function handleClick(e) {
  const row = parseInt(e.currentTarget.dataset.row);
  const col = parseInt(e.currentTarget.dataset.col);

  if (selected) {
    if (isValidMove(selected.row, selected.col, row, col)) {
      movePiece(selected.row, selected.col, row, col);
    }
    selected = null;
    renderBoard();
  } else {
    const piece = board[row][col];
    if (piece && isCurrentPlayersPiece(piece)) {
      selected = { row, col };
    }
  }
}

function movePiece(fr, fc, tr, tc) {
  board[tr][tc] = board[fr][fc];
  board[fr][fc] = "";
  currentPlayer = currentPlayer === "white" ? "black" : "white";

  if (currentPlayer === "black") {
    setTimeout(makeAIMove, 400);
  }
}

function makeAIMove() {
  const moves = [];

  for (let fr = 0; fr < 8; fr++) {
    for (let fc = 0; fc < 8; fc++) {
      const piece = board[fr][fc];
      if (piece && piece === piece.toLowerCase()) {
        for (let tr = 0; tr < 8; tr++) {
          for (let tc = 0; tc < 8; tc++) {
            if (isValidMove(fr, fc, tr, tc)) {
              moves.push({ fr, fc, tr, tc });
            }
          }
        }
      }
    }
  }

  if (moves.length === 0) return;

  const move = moves[Math.floor(Math.random() * moves.length)];
  board[move.tr][move.tc] = board[move.fr][move.fc];
  board[move.fr][move.fc] = "";
  currentPlayer = "white";
  renderBoard();
}

function isCurrentPlayersPiece(piece) {
  return currentPlayer === "white"
    ? piece === piece.toUpperCase()
    : piece === piece.toLowerCase();
}

function isSameColor(a, b) {
  return (a === a.toUpperCase()) === (b === b.toUpperCase());
}

function isValidMove(fr, fc, tr, tc) {
  const piece = board[fr][fc];
  if (!piece) return false;

  const target = board[tr][tc];
  if (target && isSameColor(piece, target)) return false;

  const dr = tr - fr;
  const dc = tc - fc;
  const lower = piece.toLowerCase();

  switch (lower) {
    case "p":
      return validatePawn(piece, fr, fc, tr, tc, dr, dc);

    case "r":
      return (fr === tr || fc === tc);

    case "n":
      return (Math.abs(dr) === 2 && Math.abs(dc) === 1) ||
             (Math.abs(dr) === 1 && Math.abs(dc) === 2);

    case "b":
      return Math.abs(dr) === Math.abs(dc);

    case "q":
      return fr === tr || fc === tc || Math.abs(dr) === Math.abs(dc);

    case "k":
      return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;
  }

  return false;
}

function validatePawn(piece, fr, fc, tr, tc, dr, dc) {
  const isWhite = piece === piece.toUpperCase();
  const direction = isWhite ? -1 : 1;

  if (dc === 0 && dr === direction && !board[tr][tc]) return true;
  if (Math.abs(dc) === 1 && dr === direction && board[tr][tc]) return true;

  return false;
}

renderBoard();
</script>

</body>
</html>
